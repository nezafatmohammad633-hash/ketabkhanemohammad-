<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کتابخانه شخصی محمد نظافت</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f1ea;color:#242424}
header{padding:32px 20px;text-align:center;background:#30281f;color:#fff}
header h1{margin:0 0 8px;font-size:30px}header p{margin:0;opacity:.8}
.wrap{max-width:1200px;margin:auto;padding:22px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
input,select{padding:12px 14px;border:1px solid #cfc7bb;border-radius:10px;background:white;font-size:15px}
input{flex:1;min-width:240px}.stats{margin:12px 0 20px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:#fff;border:1px solid #e2ddd4;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #0000000d}
.cover{height:270px;background:#e9e5de;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:contain}.noimg{color:#777}
.body{padding:15px}.title{font-weight:700;font-size:17px;line-height:1.7}.author{margin-top:7px;color:#665b50}
.meta{font-size:13px;color:#777;margin-top:10px;line-height:1.8}
button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;background:#30281f;color:#fff}
dialog{width:min(800px,92vw);border:0;border-radius:16px;padding:0}dialog::backdrop{background:#0008}
.modal{padding:24px}.modal h2{margin-top:0}.close{float:left}
.details{line-height:2}.details b{display:inline-block;min-width:100px}
footer{text-align:center;padding:30px;color:#777}
</style>
</head>
<body>
<header>
<h1>کتابخانه شخصی محمد نظافت</h1>
<p>فهرست دیجیتال کتابخانه</p>
</header>
<main class="wrap">
<div class="toolbar">
<input id="q" placeholder="جست‌وجو در نام کتاب، نویسنده، ناشر، مترجم و موضوع...">
<select id="year"><option value="">همه سال‌ها</option></select>
<select id="sort"><option value="id">ترتیب شناسه</option><option value="title">نام کتاب</option><option value="author">نویسنده</option><option value="year">سال چاپ</option></select>
</div>
<div class="stats" id="stats"></div>
<section class="grid" id="grid"></section>
</main>
<dialog id="dlg"><div class="modal"><button class="close" onclick="dlg.close()">بستن</button><div id="detail"></div></div></dialog>
<footer>© کتابخانه شخصی محمد نظافت</footer>
<script>
let books=[];
const q=document.getElementById('q'), grid=document.getElementById('grid'), stats=document.getElementById('stats');
const year=document.getElementById('year'), sort=document.getElementById('sort'), dlg=document.getElementById('dlg'), detail=document.getElementById('detail');

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fields(b){
  return {id:b[0],title:b[1],author:b[2],volume:b[3],printYear:b[4],publisher:b[5],translator:b[6],image:b[7],pages:b[8],subject:b[9],keywords:b[10]};
}
function render(){
  let arr=books.map((b,i)=>({b,i, f:fields(b)}));
  const s=q.value.trim().toLowerCase(), y=year.value;
  if(s) arr=arr.filter(x=>x.b.join(' ').toLowerCase().includes(s));
  if(y) arr=arr.filter(x=>String(x.f.printYear||'')===y);
  const mode=sort.value;
  arr.sort((a,b)=>{
    const A=String(a.f[mode==='title'?'title':mode==='author'?'author':mode==='year'?'printYear':'id']||'');
    const B=String(b.f[mode==='title'?'title':mode==='author'?'author':mode==='year'?'printYear':'id']||'');
    return A.localeCompare(B,'fa',{numeric:true});
  });
  stats.textContent=`نمایش ${arr.length} کتاب از ${books.length} کتاب`;
  grid.innerHTML=arr.map(x=>{
    const f=x.f;
    const image=(typeof f.image==='string' && f.image.startsWith('data:image/'))?`<img loading="lazy" src="${f.image}" alt="">`:`<div class="noimg">تصویر موجود نیست</div>`;
    return `<article class="card"><div class="cover">${image}</div><div class="body">
      <div class="title">${esc(f.title||'بدون عنوان')}</div>
      <div class="author">${esc(f.author||'نویسنده نامشخص')}</div>
      <div class="meta">شناسه: ${esc(f.id)}<br>جلد: ${esc(f.volume||'-')} · سال چاپ: ${esc(f.printYear||'-')}</div>
      <button onclick="showBook(${x.i})">جزئیات بیشتر</button>
    </div></article>`;
  }).join('');
}
function showBook(i){
  const f=fields(books[i]);
  const image=(typeof f.image==='string'&&f.image.startsWith('data:image/'))?`<p><img src="${f.image}" style="max-width:260px;max-height:360px;object-fit:contain"></p>`:'';
  detail.innerHTML=`${image}<h2>${esc(f.title||'بدون عنوان')}</h2>
  <div class="details">
  <p><b>شناسه:</b>${esc(f.id)}</p><p><b>نویسنده:</b>${esc(f.author)}</p><p><b>جلد:</b>${esc(f.volume)}</p>
  <p><b>سال چاپ:</b>${esc(f.printYear)}</p><p><b>ناشر:</b>${esc(f.publisher)}</p><p><b>مترجم:</b>${esc(f.translator)}</p>
  <p><b>تعداد صفحات:</b>${esc(f.pages)}</p><p><b>موضوع:</b>${esc(f.subject)}</p><p><b>کلیدواژه‌ها:</b>${esc(f.keywords)}</p>
  </div>`;
  dlg.showModal();
}
async function init(){
  const r=await fetch('./selected-books.json');
  const d=await r.json(); books=d.books||[];
  const ys=[...new Set(books.map(b=>String(b[4]||'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa',{numeric:true}));
  year.innerHTML='<option value="">همه سال‌ها</option>'+ys.map(y=>`<option>${esc(y)}</option>`).join('');
  render();
}
[q,year,sort].forEach(x=>x.addEventListener('input',render));
init().catch(e=>{stats.textContent='خطا در بارگذاری داده‌ها'; console.error(e)});
</script>
</body>
</html>
